# Every push and pull request: install from the lockfile, run the tests, then
# build - `npm run build` is `tsc -b && vite build`, so the typecheck is in it.
# This is what replaces the hand-written test counts in README and RUNNING.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
