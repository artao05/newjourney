# Publishes the app to GitHub Pages, after the tests pass. Run by hand only
# (Actions -> Deploy to GitHub Pages -> Run workflow).
#
# On 2026-11-24 this branch (v2, formerly design/tess-v2) became main and the
# old main was renamed legacy-main. The live site still serves the old app's
# Maine pilot build from legacy-main. This workflow builds the old app (npm run
# build), not v2, and this branch's old app lacks the phone fixes made on
# legacy-main, so a push here must not replace the pilot site. Until the owner
# decides what the site should serve, deploys are manual.
#
# Does nothing useful until Pages is switched on for the repository with its
# source set to "GitHub Actions" (Settings -> Pages). That is a decision for the
# repository's owner, not for this workflow, so it deliberately does not try to
# enable Pages itself. The site then lives at https://artao05.github.io/newjourney/
# - the build uses relative paths (base: './'), so it runs under that subpath
# unchanged, service worker and precache included.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half-way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
